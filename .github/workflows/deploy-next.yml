name: deploy-next

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - ".github/workflows/deploy-next.yml"

permissions:
  contents: read

jobs:
  docs-next-publish:
    name: docs/next/ auto-rebuild (main only, dark launch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json
      - name: install ui dependencies
        run: npm ci
        working-directory: ui
      - name: build and stage into docs/next/
        run: ./scripts/deploy-next.sh
      - name: commit + push if docs/next/ changed
        env:
          BOT_COMMIT_PREFIX: "chore(ui): rebuild docs/next dark launch"
        run: |
          if [ -z "$(git status --porcelain -- docs/next)" ]; then
            echo "docs/next/ already in sync"
            exit 0
          fi
          last_msg=$(git log -1 --pretty=%s)
          if [[ "$last_msg" == "$BOT_COMMIT_PREFIX"* ]]; then
            echo "last commit was already a bot regen; not pushing to avoid loop"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/next
          git commit -m "$BOT_COMMIT_PREFIX"
          branch="${GITHUB_REF#refs/heads/}"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${branch}"; then
              echo "push succeeded on attempt $attempt"
              exit 0
            fi
            echo "push attempt $attempt rejected; rebasing onto origin/${branch}"
            git fetch origin "${branch}"
            if ! git rebase "origin/${branch}"; then
              echo "rebase produced a conflict; aborting and giving up cleanly"
              git rebase --abort || true
              exit 0
            fi
            sleep "$((attempt * 2))"
          done
          echo "push failed after 5 attempts; main will self-heal on next push"
          exit 0
