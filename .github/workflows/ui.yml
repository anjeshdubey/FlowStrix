name: ui

on:
  pull_request:
    branches: [main]
    paths:
      - "ui/**"
      - ".github/workflows/ui.yml"

permissions:
  contents: read

jobs:
  build-check:
    name: typecheck + build (both bases, throwaway output)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json
      - name: install ui dependencies
        run: npm ci
        working-directory: ui
      - name: typecheck
        run: npx tsc --noEmit
        working-directory: ui
      - name: build (live base, not committed)
        run: npm run build
        working-directory: ui
      - name: build (dark-launch base, not committed)
        run: npm run build:next
        working-directory: ui
