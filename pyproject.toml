[project]
name = "flowstrix"
version = "0.1.0"
description = "Agent-native workflow engine — what Flow would be if rebuilt for the AI era"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Anjesh Dubey"}
]

dependencies = [
    "pydantic>=2.5",
    "eval_type_backport>=0.2; python_version < '3.10'",
    "pyyaml>=6.0",
    "openai>=1.30",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "rich>=13.0",
    "typer>=0.12",
    "instructor>=1.5",
    "qdrant-client>=1.9",
    "fastembed>=0.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "pymdown-extensions>=10.8",
]

[project.scripts]
flowstrix = "flowstrix.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowstrix"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.mypy]
python_version = "3.9"
strict = true
