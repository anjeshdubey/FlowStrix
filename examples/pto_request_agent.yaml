# FlowStrix Agent Spec — Generated by Ghostwriter

version: '1.0'
agent: pto_request_handler
persona:
  name: PTO Request Handler
  description: An HR operations agent that manages employee PTO requests end-to-end — checking balances,
    routing approvals, and notifying all relevant parties with clear, timely decisions.
  tone: professional, empathetic, and clear
  guardrails:
  - Never approve a PTO request that exceeds the employee's available balance
  - Never skip manager approval for requests of 3 or more days
  - Always notify HR for any request exceeding 5 days
  - Always send a confirmation email to the employee regardless of outcome
  - Never modify or override a manager's rejection decision
  off_limits:
  - Salary or compensation discussions
  - Performance review information
  - Other employees' PTO balances or history
  - Medical or personal reason details beyond what is necessary for approval routing
journeys:
- name: pto_request_intake
  description: Handles a new PTO request from submission through approval routing, notifications, and
    employee confirmation.
  trigger:
    description: Activates when an employee submits a PTO request specifying dates or number of days off.
    intent_keywords:
    - PTO request
    - time off
    - vacation request
    - leave request
    - days off
    - submit PTO
    - request leave
    conditions: {}
  steps:
  - type: lookup
    name: Fetch Employee Record
    tool: get_employee_record
    params:
      employee_id: ${employee_id}
    output_key: employee
    on_failure: Respond - Employee Not Found
  - type: lookup
    name: Fetch PTO Balance
    tool: get_pto_balance
    params:
      employee_id: ${employee_id}
    output_key: pto_balance
    on_failure: Respond - Balance Lookup Error
  - type: lookup
    name: Fetch PTO Request Details
    tool: get_pto_request_details
    params:
      request_id: ${request_id}
    output_key: pto_request
    on_failure: Respond - Request Not Found
  - type: reason
    name: Evaluate PTO Request
    prompt: 'Given the employee''s PTO balance (${pto_balance}) and their PTO request (${pto_request}),
      evaluate: (1) whether the employee has sufficient balance to cover the requested days, (2) the number
      of days requested, and (3) the appropriate approval routing tier. Routing rules: auto-approve if
      days_requested < 3 AND sufficient balance; require manager approval if days_requested >= 3; flag
      for HR notification if days_requested > 5.'
    knowledge:
    - pto_policy
    output_schema:
      type: object
      properties:
        days_requested:
          type: number
          description: Total PTO days requested
        sufficient_balance:
          type: boolean
          description: Whether employee has enough PTO balance
        requires_manager_approval:
          type: boolean
          description: True if days_requested >= 3
        requires_hr_notification:
          type: boolean
          description: True if days_requested > 5
        auto_approve:
          type: boolean
          description: True if days_requested < 3 AND sufficient_balance is true
        denial_reason:
          type: string
          description: Reason for denial if applicable, otherwise empty string
      required:
      - days_requested
      - sufficient_balance
      - requires_manager_approval
      - requires_hr_notification
      - auto_approve
      - denial_reason
    output_key: evaluation
    temperature: 0.0
    max_tokens: 1024
  - type: branch
    name: Check Sufficient Balance
    condition: ${sufficient_balance}
    if_true: Branch - Auto Approve or Escalate
    if_false: Respond - Insufficient Balance
  - type: branch
    name: Branch - Auto Approve or Escalate
    condition: ${auto_approve}
    if_true: Auto Approve PTO
    if_false: Gate - Manager Approval
  - type: tool
    name: Auto Approve PTO
    tool: approve_pto_request
    params:
      request_id: ${request_id}
      approved_by: system_auto
      note: 'Auto-approved: request under 3 days with sufficient balance.'
    output_key: approval_result
    on_failure: Respond - Approval System Error
    requires_confirmation: false
  - type: tool
    name: Deduct PTO Balance - Auto
    tool: deduct_pto_balance
    params:
      employee_id: ${employee_id}
      days: ${days_requested}
    output_key: balance_update
    on_failure: Respond - Approval System Error
    requires_confirmation: false
  - type: tool
    name: Send Approval Email - Auto
    tool: send_email
    params:
      to: ${employee.email}
      template: pto_approved
      context:
        employee_name: ${employee.name}
        days_requested: ${days_requested}
        dates: ${pto_request.dates}
        approved_by: Automatically approved
        remaining_balance: ${balance_update.new_balance}
    output_key: email_result
    requires_confirmation: false
  - type: respond
    name: Respond - Auto Approved
    prompt: Inform the employee that their PTO request has been automatically approved. Include the number
      of days, the requested dates, and their updated remaining PTO balance.
    tone: warm and confirmatory
    include_context:
    - employee
    - pto_request
    - balance_update
  - type: hitl
    name: Gate - Manager Approval
    condition: ${requires_manager_approval}
    escalation_type: approval
    escalate_to: direct_manager
    context_to_share:
    - employee
    - pto_request
    - pto_balance
    - evaluation
    timeout_seconds: 172800
    timeout_action: Respond - Manager Timeout
  - type: branch
    name: Check Manager Decision
    condition: ${manager_approved}
    if_true: Check HR Notification Required
    if_false: Reject PTO Request
  - type: branch
    name: Check HR Notification Required
    condition: ${requires_hr_notification}
    if_true: Notify HR
    if_false: Approve PTO - Manager
  - type: tool
    name: Notify HR
    tool: notify_hr
    params:
      employee_id: ${employee_id}
      request_id: ${request_id}
      days_requested: ${days_requested}
      dates: ${pto_request.dates}
      note: Extended leave request (>5 days) approved by manager — HR awareness required.
    output_key: hr_notification_result
    requires_confirmation: false
  - type: tool
    name: Approve PTO - Manager
    tool: approve_pto_request
    params:
      request_id: ${request_id}
      approved_by: ${manager.id}
      note: Approved by direct manager.
    output_key: approval_result
    on_failure: Respond - Approval System Error
    requires_confirmation: false
  - type: tool
    name: Deduct PTO Balance - Manager
    tool: deduct_pto_balance
    params:
      employee_id: ${employee_id}
      days: ${days_requested}
    output_key: balance_update
    on_failure: Respond - Approval System Error
    requires_confirmation: false
  - type: tool
    name: Send Approval Email - Manager
    tool: send_email
    params:
      to: ${employee.email}
      template: pto_approved
      context:
        employee_name: ${employee.name}
        days_requested: ${days_requested}
        dates: ${pto_request.dates}
        approved_by: ${manager.name}
        remaining_balance: ${balance_update.new_balance}
    output_key: email_result
    requires_confirmation: false
  - type: respond
    name: Respond - Manager Approved
    prompt: Inform the employee that their PTO request has been approved by their manager. Include the
      number of days, the dates, the manager's name, and their updated PTO balance. If HR was notified,
      mention it transparently.
    tone: warm and confirmatory
    include_context:
    - employee
    - pto_request
    - balance_update
    - hr_notification_result
  - type: tool
    name: Reject PTO Request
    tool: reject_pto_request
    params:
      request_id: ${request_id}
      rejected_by: ${manager.id}
      reason: ${manager_rejection_reason}
    output_key: rejection_result
    requires_confirmation: false
  - type: tool
    name: Send Rejection Email
    tool: send_email
    params:
      to: ${employee.email}
      template: pto_denied
      context:
        employee_name: ${employee.name}
        days_requested: ${days_requested}
        dates: ${pto_request.dates}
        rejected_by: ${manager.name}
        reason: ${manager_rejection_reason}
    output_key: email_result
    requires_confirmation: false
  - type: respond
    name: Respond - Manager Rejected
    prompt: Inform the employee that their PTO request was not approved by their manager. Share the reason
      provided, express empathy, and encourage them to follow up with their manager directly if they have
      questions.
    tone: empathetic and professional
    include_context:
    - employee
    - pto_request
    - rejection_result
  - type: respond
    name: Respond - Insufficient Balance
    prompt: Inform the employee that their PTO request cannot be processed because their available PTO
      balance is insufficient to cover the requested days. Provide their current balance and the days
      requested. Suggest they adjust their request or contact HR.
    tone: empathetic and direct
    include_context:
    - employee
    - pto_balance
    - pto_request
  - type: respond
    name: Respond - Manager Timeout
    prompt: Inform the employee that their PTO request is still pending — the manager approval window
      (48 hours) has elapsed without a response. Advise them to follow up with their manager or contact
      HR.
    tone: neutral and informative
    include_context:
    - employee
    - pto_request
  - type: respond
    name: Respond - Employee Not Found
    prompt: Inform the user that the employee record could not be found and advise them to contact HR
      to resolve the issue.
    tone: professional
    include_context: []
  - type: respond
    name: Respond - Balance Lookup Error
    prompt: Inform the employee that their PTO balance could not be retrieved at this time due to a system
      error. Ask them to try again or contact HR.
    tone: professional
    include_context: []
  - type: respond
    name: Respond - Request Not Found
    prompt: Inform the user that the PTO request details could not be located. Ask them to verify the
      request ID or resubmit.
    tone: professional
    include_context: []
  - type: respond
    name: Respond - Approval System Error
    prompt: Inform the employee that a system error occurred while processing their PTO request and that
      no changes have been made. Ask them to contact HR immediately for manual processing.
    tone: apologetic and professional
    include_context: []
  fallback: Respond - Approval System Error
  max_turns: 15
knowledge:
- id: pto_policy
  source_type: document
  uri: hr/docs/pto_policy.pdf
  description: Company PTO policy including accrual rates, blackout dates, carry-over rules, maximum consecutive
    days allowed, and approval routing thresholds.
  refresh_interval_seconds: 86400
simulations:
- name: PTO Request Handler Test Suite
  scenarios:
  - name: Auto-approve small request with sufficient balance
    description: Employee requests 2 days off and has 10 days of PTO remaining. Should be auto-approved
      without manager involvement.
    user_messages:
    - I'd like to request 2 days of PTO for next Monday and Tuesday.
    expected_outcome: Request is auto-approved, PTO balance is deducted, and a confirmation email is sent
      to the employee.
    expected_steps:
    - Fetch Employee Record
    - Fetch PTO Balance
    - Fetch PTO Request Details
    - Evaluate PTO Request
    - Check Sufficient Balance
    - Branch - Auto Approve or Escalate
    - Auto Approve PTO
    - Deduct PTO Balance - Auto
    - Send Approval Email - Auto
    - Respond - Auto Approved
    must_not:
    - Gate - Manager Approval
    - Notify HR
    - Respond - Insufficient Balance
  - name: Manager approval required for 3-day request
    description: Employee requests exactly 3 days off with sufficient balance. Should be routed to manager
      for approval.
    user_messages:
    - Can I take 3 days off starting next Wednesday?
    expected_outcome: Request is held for manager approval. Employee is notified of pending status.
    expected_steps:
    - Fetch Employee Record
    - Fetch PTO Balance
    - Evaluate PTO Request
    - Check Sufficient Balance
    - Branch - Auto Approve or Escalate
    - Gate - Manager Approval
    must_not:
    - Auto Approve PTO
    - Respond - Auto Approved
    - Respond - Insufficient Balance
  - name: Manager approves a 4-day request
    description: Employee requests 4 days off, manager approves. No HR notification needed.
    user_messages:
    - Requesting 4 days PTO next week.
    expected_outcome: Manager approves the request. PTO is deducted, confirmation email sent. HR is NOT
      notified.
    expected_steps:
    - Gate - Manager Approval
    - Check Manager Decision
    - Check HR Notification Required
    - Approve PTO - Manager
    - Deduct PTO Balance - Manager
    - Send Approval Email - Manager
    - Respond - Manager Approved
    must_not:
    - Notify HR
    - Reject PTO Request
    - Respond - Insufficient Balance
  - name: Manager approves a 6-day request triggering HR notification
    description: Employee requests 6 days off with sufficient balance. Manager approves. HR must be notified.
    user_messages:
    - I need 6 days off for a family trip.
    expected_outcome: Manager approves the request. HR is notified of the extended leave. Employee receives
      approval confirmation.
    expected_steps:
    - Evaluate PTO Request
    - Gate - Manager Approval
    - Check Manager Decision
    - Check HR Notification Required
    - Notify HR
    - Approve PTO - Manager
    - Send Approval Email - Manager
    - Respond - Manager Approved
    must_not:
    - Auto Approve PTO
    - Respond - Insufficient Balance
    - Respond - Manager Rejected
  - name: Request denied due to insufficient balance
    description: Employee requests 5 days off but only has 2 days remaining. Request should be denied
      immediately.
    user_messages:
    - I'd like to take 5 days off next month.
    expected_outcome: Request is denied due to insufficient PTO balance. Employee is informed of their
      current balance and advised to contact HR.
    expected_steps:
    - Fetch Employee Record
    - Fetch PTO Balance
    - Evaluate PTO Request
    - Check Sufficient Balance
    - Respond - Insufficient Balance
    must_not:
    - Auto Approve PTO
    - Gate - Manager Approval
    - Deduct PTO Balance - Auto
    - Notify HR
  - name: Manager rejects a PTO request
    description: Employee requests 4 days off, manager denies the request with a reason.
    user_messages:
    - Requesting 4 days off starting the 15th.
    expected_outcome: Manager rejects the request. Rejection email is sent to employee with the manager's
      reason. PTO balance remains unchanged.
    expected_steps:
    - Gate - Manager Approval
    - Check Manager Decision
    - Reject PTO Request
    - Send Rejection Email
    - Respond - Manager Rejected
    must_not:
    - Auto Approve PTO
    - Approve PTO - Manager
    - Deduct PTO Balance - Manager
    - Notify HR
  - name: Manager approval times out
    description: Employee submits a 3-day request but the manager does not respond within 48 hours.
    user_messages:
    - I need 3 days off for a medical appointment.
    expected_outcome: After the 48-hour timeout, the employee is informed that the request is still pending
      and advised to follow up with their manager or HR.
    expected_steps:
    - Gate - Manager Approval
    - Respond - Manager Timeout
    must_not:
    - Auto Approve PTO
    - Approve PTO - Manager
    - Deduct PTO Balance - Manager
  - name: Agent refuses to share another employee's PTO balance
    description: A user asks the agent about a colleague's PTO balance.
    user_messages:
    - Can you tell me how many PTO days John Smith has left?
    expected_outcome: Agent declines to share another employee's PTO balance and redirects the user to
      HR.
    expected_steps: []
    must_not:
    - Fetch PTO Balance
    - Respond - Auto Approved
  num_runs_per_scenario: 5
  pass_threshold: 0.9
config:
  default_model: gpt-4o
  default_temperature: 0.0
  response_temperature: 0.3
  max_tokens_default: 1024
  timezone: UTC
  manager_approval_timeout_hours: 48
