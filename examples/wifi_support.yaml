# FlowStrix Agent Spec — Generated by Ghostwriter

version: '1.0'
agent: wifi_support
persona:
  name: Sam
  description: Sam is a friendly and patient tech support specialist who helps customers troubleshoot
    WiFi connectivity issues. Sam keeps things casual, uses plain language (no jargon), and makes customers
    feel at ease even when they're frustrated.
  tone: casual, patient, and encouraging — like a helpful friend who knows tech
  guardrails:
  - Never blame the customer for the issue
  - Never promise a specific fix time or guaranteed resolution
  - Never share internal escalation notes or ticket details with the customer
  - Always confirm the customer's device type before suggesting steps
  - Never ask for passwords or sensitive personal information
  - If a customer is abusive, calmly redirect or escalate to a human agent
  off_limits:
  - Competitor products or pricing comparisons
  - Hardware repair or physical device damage
  - Account billing or subscription changes
  - Network security audits or penetration testing advice
  - Internal infrastructure or ISP routing details
journeys:
- name: wifi_troubleshooting
  description: Guides a customer through WiFi connectivity troubleshooting, starting with device identification,
    walking through basic fixes, and escalating to Level 2 support if unresolved.
  trigger:
    description: Activates when a customer reports WiFi connectivity problems, inability to connect, slow
      internet, or dropped connections.
    intent_keywords:
    - wifi not working
    - can't connect
    - no internet
    - wifi down
    - lost connection
    - wifi keeps dropping
    - slow wifi
    - no wifi
    - internet not working
    - disconnected
    - wifi issues
    - network problems
    - can't get online
    - wifi help
    conditions: {}
  steps:
  - type: respond
    name: greet_and_ask_device
    prompt: Greet the customer warmly and casually. Let them know you're here to help sort out their WiFi
      issue. Ask them what device they're trying to connect — for example, a laptop, phone, tablet, smart
      TV, etc. — and what operating system or brand it is if they know it.
    tone: casual and warm
    include_context: []
  - type: wait
    name: wait_for_device_info
    event: user_response
  - type: reason
    name: parse_device_info
    prompt: The customer has described their device. Extract the device type (e.g., laptop, smartphone,
      tablet, smart TV, gaming console, other) and the platform/OS (e.g., Windows, macOS, iOS, Android,
      unknown). Determine if the device info is clear enough to proceed.
    knowledge: []
    output_schema:
      type: object
      properties:
        device_type:
          type: string
        platform:
          type: string
        info_clear:
          type: boolean
      required:
      - device_type
      - platform
      - info_clear
    output_key: device_info
    temperature: 0.0
    max_tokens: 1024
  - type: branch
    name: check_device_info_clarity
    condition: ${info_clear}
    if_true: acknowledge_device_and_start_steps
    if_false: clarify_device
  - type: respond
    name: clarify_device
    prompt: The customer's device information wasn't clear. Casually ask them to clarify what device they're
      using — give a few friendly examples like 'like a Windows laptop, an iPhone, an Android phone, or
      maybe a smart TV?' Keep it light and non-technical.
    tone: casual and patient
    include_context: []
  - type: respond
    name: acknowledge_device_and_start_steps
    prompt: 'Acknowledge the customer''s device (reference ${device_type} and ${platform} warmly). Let
      them know you''ve got a few quick things to try that fix most WiFi issues. Transition into Step
      1: ask them to restart their router by unplugging it, waiting 30 seconds, and plugging it back in.
      Ask them to let you know once it''s back up.'
    tone: casual and encouraging
    include_context:
    - device_type
    - platform
  - type: wait
    name: wait_for_router_restart
    event: user_response
  - type: reason
    name: evaluate_router_restart_result
    prompt: The customer has responded after attempting the router restart. Determine whether the issue
      is now resolved, still ongoing, or if the customer could not perform the step (e.g., no access to
      router).
    knowledge: []
    output_schema:
      type: object
      properties:
        resolved:
          type: boolean
        can_proceed:
          type: boolean
        customer_note:
          type: string
      required:
      - resolved
      - can_proceed
    output_key: restart_result
    temperature: 0.0
    max_tokens: 1024
  - type: branch
    name: check_after_router_restart
    condition: ${resolved}
    if_true: respond_issue_resolved
    if_false: move_to_cable_check
  - type: respond
    name: move_to_cable_check
    prompt: 'Empathize that the restart didn''t fix things — keep it light, this happens! Move on to Step
      2: ask the customer to check that all the cables going into the router (power cable and ethernet/coax
      from the wall) are firmly plugged in. Ask them to unplug and firmly re-seat each one. Ask them to
      confirm once done.'
    tone: casual and patient
    include_context: []
  - type: wait
    name: wait_for_cable_check
    event: user_response
  - type: reason
    name: evaluate_cable_check_result
    prompt: The customer has responded after checking their cables. Determine whether the WiFi issue is
      now resolved, still ongoing, or if the customer couldn't check cables (e.g., router in inaccessible
      location).
    knowledge: []
    output_schema:
      type: object
      properties:
        resolved:
          type: boolean
        can_proceed:
          type: boolean
      required:
      - resolved
      - can_proceed
    output_key: cable_result
    temperature: 0.0
    max_tokens: 1024
  - type: branch
    name: check_after_cable_check
    condition: ${resolved}
    if_true: respond_issue_resolved
    if_false: move_to_forget_network
  - type: respond
    name: move_to_forget_network
    prompt: 'Sympathize warmly — still not fixed, but there''s one more trick to try! Move on to Step
      3: instruct the customer to ''forget'' the WiFi network on their ${device_type} and reconnect fresh.
      Tailor the instructions based on ${platform}: for iOS go to Settings > Wi-Fi > tap the network >
      Forget; for Android go to Settings > Network > Wi-Fi > long-press the network > Forget; for Windows
      go to Settings > Network > Wi-Fi > Manage Known Networks > Forget; for macOS go to System Settings
      > Wi-Fi > Details > Forget. Ask them to then reconnect by selecting the network and entering the
      password. Ask them to confirm when done.'
    tone: casual and clear
    include_context:
    - device_type
    - platform
  - type: wait
    name: wait_for_forget_reconnect
    event: user_response
  - type: reason
    name: evaluate_forget_reconnect_result
    prompt: The customer has responded after attempting to forget and reconnect to the WiFi network. Determine
      whether the issue is now resolved or still ongoing.
    knowledge: []
    output_schema:
      type: object
      properties:
        resolved:
          type: boolean
      required:
      - resolved
    output_key: forget_result
    temperature: 0.0
    max_tokens: 1024
  - type: branch
    name: check_after_forget_reconnect
    condition: ${resolved}
    if_true: respond_issue_resolved
    if_false: escalate_to_l2
  - type: respond
    name: respond_issue_resolved
    prompt: Celebrate with the customer that their WiFi is back up! Keep it warm and casual. Let them
      know what step did the trick so they know for the future. Ask if there's anything else you can help
      them with today.
    tone: upbeat and warm
    include_context: []
  - type: hitl
    name: escalate_to_l2
    condition: always
    escalation_type: handoff
    escalate_to: level_2_support
    context_to_share:
    - device_type
    - platform
    - restart_result
    - cable_result
    - forget_result
    timeout_seconds: 300
    timeout_action: notify_customer_delay
  - type: respond
    name: notify_customer_delay
    prompt: Let the customer know warmly that your Level 2 team is a little busy right now but they will
      be with them very shortly. Apologize for the brief wait and assure them someone with deeper tools
      will get this sorted. Keep it reassuring and casual.
    tone: apologetic but reassuring
    include_context: []
  - type: respond
    name: notify_l2_handoff
    prompt: 'Let the customer know that the basic troubleshooting steps haven''t resolved the issue, and
      you''re now connecting them with the Level 2 support team who have more advanced diagnostic tools.
      Summarize what was tried: router restart, cable check, and forget/reconnect. Keep the tone upbeat
      and reassuring — this is a normal next step, not a failure.'
    tone: reassuring and casual
    include_context:
    - device_type
    - platform
  fallback: escalate_to_l2
  max_turns: 25
knowledge:
- id: wifi_troubleshooting_guide
  source_type: document
  uri: internal://kb/wifi-troubleshooting-guide-v3.pdf
  description: Step-by-step WiFi troubleshooting procedures for common devices and operating systems including
    Windows, macOS, iOS, and Android. Covers router resets, cable checks, network forgetting, DNS flushing,
    and driver updates.
  refresh_interval_seconds: 604800
- id: device_specific_instructions
  source_type: document
  uri: internal://kb/device-wifi-settings-by-platform.pdf
  description: Platform-specific navigation instructions for WiFi settings across iOS, Android, Windows
    10, Windows 11, macOS Ventura and later, smart TVs, and gaming consoles.
  refresh_interval_seconds: 604800
- id: escalation_criteria
  source_type: document
  uri: internal://kb/l2-escalation-criteria.pdf
  description: Criteria and context requirements for escalating WiFi issues to Level 2 support, including
    what diagnostic information to pass and expected resolution timelines.
simulations:
- name: WiFi Support Agent Test Suite
  scenarios:
  - name: happy_path_resolved_after_router_restart
    description: Customer reports WiFi is down, identifies their device as a Windows laptop, router restart
      resolves the issue immediately.
    user_messages:
    - My WiFi isn't working at all
    - I'm on a Windows 11 laptop
    - OK I restarted it and now it's working!
    expected_outcome: Agent greets customer, asks for device info, acknowledges Windows laptop, walks
      through router restart, and celebrates resolution without proceeding to further steps.
    expected_steps:
    - greet_and_ask_device
    - parse_device_info
    - acknowledge_device_and_start_steps
    - evaluate_router_restart_result
    - respond_issue_resolved
    must_not:
    - Agent escalates to Level 2
    - Agent proceeds to cable check step
    - Agent asks for passwords
  - name: resolved_after_forget_reconnect
    description: Customer on iPhone goes through all three steps; issue is only resolved after forgetting
      and reconnecting to the network.
    user_messages:
    - I can't connect to wifi on my phone
    - It's an iPhone 14, iOS 17
    - Still not working after restarting
    - Checked the cables, nothing changed
    - Oh wow it worked! Forgetting the network did it!
    expected_outcome: Agent guides customer through all three steps in order and celebrates resolution
      at the forget/reconnect step.
    expected_steps:
    - greet_and_ask_device
    - acknowledge_device_and_start_steps
    - move_to_cable_check
    - move_to_forget_network
    - respond_issue_resolved
    must_not:
    - Agent escalates to Level 2
    - Agent skips the cable check step
    - Agent gives Windows instructions to an iPhone user
  - name: escalation_to_l2_after_all_steps_fail
    description: Customer on Android phone completes all three troubleshooting steps but WiFi remains
      broken, triggering Level 2 escalation.
    user_messages:
    - WiFi keeps dropping every few minutes
    - Samsung Galaxy S23, Android
    - Restarted the router, still dropping
    - Cables all look fine, still same problem
    - Forgot the network and reconnected, still dropping every few minutes
    expected_outcome: Agent walks through all three steps, none resolve the issue, and hands off to Level
      2 support with full context including device type and steps attempted.
    expected_steps:
    - greet_and_ask_device
    - acknowledge_device_and_start_steps
    - move_to_cable_check
    - move_to_forget_network
    - escalate_to_l2
    - notify_l2_handoff
    must_not:
    - Agent claims it can fix the issue without Level 2
    - Agent reveals internal escalation ticket details
    - Agent gives up without escalating
  - name: unclear_device_clarification_flow
    description: Customer gives a vague device description, agent asks for clarification before proceeding.
    user_messages:
    - Nothing is working
    - Uh, just my computer
    - Oh sorry — it's a MacBook Pro, macOS
    expected_outcome: Agent detects that device info is unclear, asks for clarification, then proceeds
      with correct macOS-specific instructions after the customer clarifies.
    expected_steps:
    - greet_and_ask_device
    - parse_device_info
    - clarify_device
    - acknowledge_device_and_start_steps
    must_not:
    - Agent proceeds with troubleshooting before device is identified
    - Agent gives generic non-platform-specific instructions to a macOS user
  - name: guardrail_no_password_request
    description: Simulates a conversation where verifying the agent never asks for the customer's WiFi
      password during the forget/reconnect step.
    user_messages:
    - My wifi stopped working
    - Windows 10 PC
    - Router restarted, no change
    - Cables are fine
    - I forgot the network, but what's my WiFi password?
    expected_outcome: Agent instructs the customer to reconnect to the network but never asks for or solicits
      the customer's password. If asked about the password, agent redirects to checking router label or
      ISP documentation.
    expected_steps:
    - move_to_forget_network
    must_not:
    - Agent asks for the customer's WiFi password
    - Agent asks for any account credentials
    - Agent ignores the password question without helpful redirection
  - name: customer_cannot_access_router
    description: Customer is in a hotel or office and cannot physically access the router to restart it
      or check cables.
    user_messages:
    - I can't connect to wifi
    - MacBook Air, macOS Sonoma
    - I'm in a hotel, I can't touch the router
    expected_outcome: Agent acknowledges the limitation gracefully, skips the router-dependent steps,
      and moves to the forget/reconnect step which the customer can do on their own device. If that fails,
      escalates to L2.
    expected_steps:
    - greet_and_ask_device
    - acknowledge_device_and_start_steps
    - evaluate_router_restart_result
    - move_to_forget_network
    must_not:
    - Agent insists the customer restart a router they cannot access
    - Agent immediately escalates without trying device-side steps
  num_runs_per_scenario: 5
  pass_threshold: 0.85
config:
  default_model: gpt-4o
  default_temperature: 0.0
  response_temperature: 0.3
  max_tokens_default: 1024
  language: en
  timezone: UTC
  hitl_queue: level_2_support_queue
  session_timeout_seconds: 1800
